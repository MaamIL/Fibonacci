<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fibonacci Sequence · Fibonacci Fun</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="top-bar">
      <span class="brand">Fibonacci Fun</span>
      <nav class="nav">
        <a href="/">Golden Ratio</a>
        <a href="/sequence" aria-current="page">Sequence</a>
      </nav>
    </header>
    <main class="page">
      <h1>Fibonacci Sequence</h1>
      <!-- prettier-ignore -->
      <p class="formula">F<sub>n</sub> = F<sub>n-1</sub> + F<sub>n-2</sub></p>
      <form id="seq-form" class="seq-form">
        <label for="n-input">How many terms?</label>
        <input id="n-input" type="number" min="1" max="1000" value="10" />
        <button type="submit">Generate</button>
      </form>
      <p id="sequence" class="sequence"></p>
      <p id="ratio" class="ratio"></p>
    </main>
    <script src="/static/js/sequence.js"></script>
  </body>
</html>
